cargo-features = ["per-package-target"]

[package]
name = "usertest"
version = "0.1.0"
edition.workspace = true
default-target = "x86_64-unknown-none"

[[bin]]
name = "usertest"
path = "src/main.rs"
# no_std, for the bare target: no test harness.
test = false
bench = false

[dependencies]
saeos-rt = { path = "../rt" }
