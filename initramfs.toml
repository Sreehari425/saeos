# What goes into the initramfs, built by `tools/mkinitramfs` (`make initramfs`).
# Sources are relative to this file. Each entry may also be a build output.

# Everything under initramfs/ appears at /.
[[tree]]
source = "initramfs"
target = "/"

# User programs (built by `make userspace` for userspace/x86_64-saeos.json).
[[file]]
source = "target/x86_64-saeos/release/hello"
target = "/bin/hello"
mode = 0o755

# Test image only (`make initramfs-test`): the QEMU user-test init.
[[file]]
source = "target/x86_64-saeos/release/usertest"
target = "/test/bin/usertest"
mode = 0o755
test = true

# Userspace: init, the shell, and the tools.
[[file]]
source = "target/x86_64-saeos/release/init"
target = "/sbin/init"
mode = 0o755

