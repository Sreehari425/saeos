# `per-package-target`: build for the BIOS target unless `--target` says
# otherwise, so plain `cargo build`/`cargo clippy` work from the workspace root.
cargo-features = ["per-package-target"]

[package]
name = "saeos"
version = "0.1.0"
edition.workspace = true
default-target = "x86_64-unknown-none"

[lints.rust]
# Set by tools/host-tests/build.rs when the task code is built into the model.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(host_model)"] }

[dependencies]

[features]
default = []
serial = []
framebuffer = []
vga-text = []
keyboard = []
mm-selftest = []
paging-debug = []
mm-stress = []
mm-lock-debug = []
mm-allocator-stats = []
mm-poison = []
mm-guard-test = ["qemu-exit"]
fault-test = ["qemu-exit"]
panic-lock-test = ["qemu-exit"]
qemu-exit = []
# Boots the test initramfs's init; its exit status is the QEMU verdict.
user-test = ["qemu-exit"]
boot-test = ["qemu-exit", "mm-selftest", "scheduler-selftest", "procfs"]
apic = []
ac97 = []
hda = []
bochs-vbe = []
procfs = []
kernel-shell = []
pit = []
rtc = []
apic-timer = ["apic"]
tsc = []
scheduler-selftest = []
scheduler-debug = []

[[bin]]
name = "saeos"
test = false
bench = false
